[versions]
# minSdk 24 (Android 7) seit 3.16: WorkManager 2.12 und DataStore 1.3 verlangen das; Android 6 entfällt.
# WireGuard: 1.0.20251231 rief CompletableFuture.newIncompleteFuture() ungeschützt auf (erst ab Android 12) →
# Absturz auf Android 9/11 (Fire TV). 1.0.20260102 sichert den Aufruf mit SDK_INT >= S ab (Upstream-Commit 3f30378c);
# LibraryApiLevelTest führt ihn deshalb als „abgesichert“. Jede neue Version dort erneut prüfen.
androidGradlePlugin = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
room = "2.8.5"
paging = "3.5.3"
work = "2.12.0"
datastore = "1.3.0"
coroutines = "1.11.0"
okhttp = "5.5.1"
coil = "3.6.3"
media3 = "1.11.1"
libvlc = "3.7.7"
# FFmpeg-Tondecoder für Media3 (MP2, AC3, E-AC3, DTS …). Jellyfin baut nur bis 1.9.0; gegen media3 1.11.1
# binär geprüft (BinaryCompatTest). Bei neuer Jellyfin-Version passend zu media3 sofort wechseln.
media3-ffmpeg = "1.9.0+1"
zxing = "3.5.4"
# Eingebauter WireGuard-Client (VpnService, Apache 2.0).
wireguard = "1.0.20260102"
desugarJdkLibs = "2.1.5"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.77.0"
# Code-Qualität: Formatierung (Spotless + ktlint), statische Prüfung (detekt), Architekturregeln (Konsist).
spotless = "8.10.4"
ktlint = "1.8.0"
detekt = "1.23.8"
konsist = "0.18.1"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
androidxBenchmark = "1.5.0"
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.4.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-doh = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
wireguard-tunnel = { module = "com.wireguard.android:tunnel", version.ref = "wireguard" }
# Echte org.json-Implementierung für Unit-Tests (android.jar enthält nur Platzhalter).
org-json = { module = "org.json:json", version = "20260814" }
# Nur Tests: liest den Bytecode des FFmpeg-Decoders für die Binärprüfung gegen die aktuelle Media3-Version.
asm = { module = "org.ow2.asm:asm", version = "9.11.1" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# Coil 3 lädt ohne Netzwerkmodul keine URLs mehr.
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
# Texterkennung auf dem Gerät (Bildbeweis Sport, Plan „Spiel-Finder“ C) – Modell in der APK, ohne Google-Play-Dienste (Fire TV).
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version = "16.0.1" }
media3-ffmpeg-decoder = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version.ref = "media3-ffmpeg" }
libvlc-all = { module = "org.videolan.android:libvlc-all", version.ref = "libvlc" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Oberflächen-Tests ohne Gerät: Robolectric (Android auf der JVM), Compose-UI-Tests und Screenshots (Roborazzi).
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
