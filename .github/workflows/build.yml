name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Release-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 fehlt" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "SIGNING_STORE_PASSWORD fehlt" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "SIGNING_KEY_ALIAS fehlt" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "SIGNING_KEY_PASSWORD fehlt" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Code-Regeln: Formatierung (ktlint), statische Prüfung (detekt), Android Lint – neue Verstöße lassen den Build scheitern.
      - name: Code-Qualität prüfen
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck detekt :app:lintRelease --stacktrace

      - name: Tests ausführen
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: APKs bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: APKs umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Player-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/*.apk "out/Player-${{ github.run_number }}-debug.apk"

      - name: APKs hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Player-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      # R8-Zuordnung zum Entschlüsseln von Absturzmeldungen der Release-APK (gleiche Lauf-Nummer wie die APK).
      - name: Mapping-Datei hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Player-Mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Testberichte hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Testberichte
          path: app/build/reports/tests/
          if-no-files-found: ignore
