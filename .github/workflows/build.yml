name: Android APK Build

on:
  push:
    # Zusätzlich die Claude-Arbeitszweige (ccr-*): APK und Prüfungen ohne Merge nach main.
    branches: [ main, 'ccr-*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21: Robolectric braucht für Android SDK 36 Java 21. Der Code bleibt auf Java 17 (compileOptions/jvmTarget).
      - name: JDK 21 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Release-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Auf main ist der Release-Schlüssel Pflicht. Auf Arbeitszweigen ohne Secrets wird nur die Debug-APK gebaut –
        # der Debug-Schlüssel ersetzt den Release-Schlüssel nie.
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$GITHUB_REF_NAME" = "main" ]; then echo "Release-Secrets fehlen (SIGNING_*)" >&2; exit 1; fi
            echo "::warning::Release-Secrets fehlen – nur Debug-APK"
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"

      # Code-Regeln: Formatierung (ktlint), statische Prüfung (detekt), Android Lint – neue Verstöße lassen den Build scheitern.
      - name: Code-Qualität prüfen
        run: |
          chmod +x gradlew
          ./gradlew --continue spotlessCheck detekt :app:lintRelease

      - name: Tests ausführen
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: APKs bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then ./gradlew assembleDebug assembleRelease --stacktrace; else ./gradlew assembleDebug --stacktrace; fi

      - name: APKs umbenennen
        run: |
          mkdir -p out
          if [ "$HAS_RELEASE_KEY" = "true" ]; then cp app/build/outputs/apk/release/*.apk "out/Player-${{ github.run_number }}.apk"; fi
          cp app/build/outputs/apk/debug/*.apk "out/Player-${{ github.run_number }}-debug.apk"

      - name: APKs hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Player-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      # R8-Zuordnung zum Entschlüsseln von Absturzmeldungen der Release-APK (gleiche Lauf-Nummer wie die APK).
      - name: Mapping-Datei hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Player-Mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # Funde direkt ins Protokoll: Die Berichte sind sonst nur als Artefakt lesbar.
      - name: Prüfberichte ausgeben (bei Fehlern)
        if: failure()
        run: |
          for f in build/reports/detekt/detekt.txt app/build/reports/lint-results-release.txt; do
            [ -f "$f" ] && { echo "===== $f"; cat "$f"; }
          done
          find app/build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | head -20 | while read -r f; do
            echo "===== $f"; grep -A15 '<failure' "$f" | head -40
          done
          exit 0

      - name: Testberichte hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Testberichte
          path: app/build/reports/tests/
          if-no-files-found: ignore
