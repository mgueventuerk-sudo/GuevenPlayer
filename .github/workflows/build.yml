name: Android APK Build

on:
  push:
    # Zusätzlich die Claude-Arbeitszweige (ccr-*): APK und Prüfungen ohne Merge nach main.
    branches: [ main, 'ccr-*' ]
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben Zweig bricht den laufenden Build ab: Nur der neueste Stand wird gebaut.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release: ${{ steps.key.outputs.release }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21: Robolectric braucht für Android SDK 36 Java 21. Der Code bleibt auf Java 17 (compileOptions/jvmTarget).
      - name: JDK 21 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Release-Schlüssel bereitstellen
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Auf main ist der Release-Schlüssel Pflicht. Auf Arbeitszweigen ohne Secrets wird nur die Debug-APK gebaut –
        # der Debug-Schlüssel ersetzt den Release-Schlüssel nie.
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$GITHUB_REF_NAME" = "main" ]; then echo "Release-Secrets fehlen (SIGNING_*)" >&2; exit 1; fi
            echo "::warning::Release-Secrets fehlen – nur Debug-APK"
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Code-Regeln: Formatierung (ktlint), statische Prüfung (detekt), Android Lint – neue Verstöße lassen den Build scheitern.
      - name: Code-Qualität prüfen
        run: |
          chmod +x gradlew
          ./gradlew --continue spotlessCheck detekt :app:lintRelease

            - name: Tests ausführen
  run: |
    chmod +x gradlew
    for attempt in 1 2 3; do
      if ./gradlew testDebugUnitTest --stacktrace; then
        exit 0
      fi
      if [ "$attempt" -lt 3 ]; then
        echo "::warning::Robolectric artifact fetch failed; retrying test run ($attempt/3)."
        sleep 20
      else
        exit 1
      fi
    done
        run: |
          chmod +x gradlew
          # Robolectric lädt das Android-14-Artifact zur Laufzeit per Maven nach.
          # Wenn dieser externe Download einmal fehlschlägt, wird nur genau dieser
          # bekannte Fehler einmalig retried; echte Testfehler brechen weiterhin ab.
          for attempt in 1 2; do
            if ./gradlew testDebugUnitTest --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && grep -R -q 'Failed to fetch maven artifact org.robolectric:android-all-instrumented' app/build/test-results/testDebugUnitTest; then
              echo "::warning::Robolectric runtime artifact fetch failed; retrying once."
              continue
            fi
            exit 1
          done
          exit 1

      - name: APKs bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then ./gradlew assembleDebug assembleRelease --stacktrace; else ./gradlew assembleDebug --stacktrace; fi

      - name: APKs umbenennen
        run: |
          mkdir -p out
          if [ "$HAS_RELEASE_KEY" = "true" ]; then cp app/build/outputs/apk/release/*.apk "out/Player-${{ github.run_number }}.apk"; fi
          cp app/build/outputs/apk/debug/*.apk "out/Player-${{ github.run_number }}-debug.apk"

      - name: APKs hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Player-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      # R8-Zuordnung zum Entschlüsseln von Absturzmeldungen der Release-APK (gleiche Lauf-Nummer wie die APK).
      - name: Mapping-Datei hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Player-Mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # Funde direkt ins Protokoll: Die Berichte sind sonst nur als Artefakt lesbar.
      - name: Prüfberichte ausgeben (bei Fehlern)
        if: failure()
        run: |
          for f in build/reports/detekt/detekt.txt app/build/reports/lint-results-release.txt; do
            [ -f "$f" ] && { echo "===== $f"; cat "$f"; }
          done
          find app/build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | head -20 | while read -r f; do
            echo "===== $f"; grep -A15 '<failure' "$f" | head -40
          done
          exit 0

      - name: Testberichte hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Testberichte
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # App-Updates (Weg 2): Jede signierte Release-APK wird Release „build-<versionCode>“ in diesem privaten Repo; die App
  # fragt mit dem Zugriffsschlüssel aus den Einstellungen nach dem neuesten. Eigener Job: Nur er bekommt Schreibrecht –
  # der Build mit Gradle-Plugins und Abhängigkeiten läuft weiter nur mit Leserecht. Nur die letzten 5 Releases bleiben.
  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: APK holen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Player-APK-${{ github.run_number }}
          path: out

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="out/Player-${{ github.run_number }}.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test -n "$CODE"
          gh release create "build-$CODE" "$APK" --title "Player $NAME" --target "$GITHUB_SHA" --latest \
            --notes "Build ${{ github.run_number }} · ${{ github.ref_name }} · $GITHUB_SHA"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
