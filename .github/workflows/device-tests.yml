name: Gerätetests (Emulator)

# Rauchtests auf echtem Android: Start, SQLite, native Bibliotheken (LibVLC, FFmpeg, WireGuard), Media3.
# Android 7 (API 24, ältestes unterstütztes), Android 9 (API 28, Fire TV) und Android 17 (API 37, aktuelles Handy).
# Der Default-Branch dieses Repos heisst nicht "main", sondern ccr-088667a5-xnf5zn. Mit "branches: [ main ]"
# hat dieser Workflow nie ausgeloest - GitHub kannte ihn gar nicht, und die Rauchtests auf echtem Android
# (LibVLC, FFmpeg, WireGuard laden nativ) liefen seit ihrer Einfuehrung kein einziges Mal.
on:
  push:
    branches: [ main, 'ccr-*' ]
  workflow_dispatch:

permissions:
  contents: read

# Wie beim Build-Workflow: Ein neuer Push bricht den laufenden ab. Ohne das lief die Matrix weiter, waehrend
# der Build desselben Stands schon abgebrochen war - bei jedem Push stapelten sich bis zu drei
# 60-Minuten-Emulatoren fuer einen Stand, den niemand mehr braucht.
concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 24, 28, 37 ]
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Der erste echte Lauf scheiterte hier: "Not enough space to create userdata partition.
      # Available: 7149.41 MB, need 7372.80 MB". Der Build davor baut mit vier ABIs
      # (-PbenchmarkEmulator=true) und LibVLC bringt ~86 MB native Bibliotheken mit - danach fehlen dem
      # Emulator gut 200 MB. Die vorinstallierten Toolchains des Runners braucht dieser Build nicht.
      - name: Platz auf dem Runner schaffen
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test-APKs bauen
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PbenchmarkEmulator=true --stacktrace

      - name: Rauchtests im Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level >= 34 && 'google_apis' || 'default' }}
          disable-animations: true
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-device-tests.sh

      - name: Testberichte hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Geraetetests-API-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  # Baseline-Profil auf einem Emulator erzeugen (Plan B): Das eingecheckte Profil ist von Hand geschrieben
  # (23 Regeln, Stand 3.39) - ein gemessenes deckt die Pfade ab, die wirklich laufen, statt der vermuteten.
  # Laeuft nur von Hand, weil ein Emulator-Lauf teuer ist. Das Ergebnis kommt als
  # Artefakt heraus und wird bewusst nicht automatisch committet: Ein Profil, das niemand angesehen hat,
  # gehoert nicht ungeprueft in die App.
  baseline-profile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The profile test builds the app's release variant, which must never use the repository debug key.
      - name: Release-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Baseline-Profil braucht die SIGNING_* Release-Secrets, weil es die Release-App baut."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # Der erste echte Lauf scheiterte hier: "Not enough space to create userdata partition.
      # Available: 7149.41 MB, need 7372.80 MB". Der Build davor baut mit vier ABIs
      # (-PbenchmarkEmulator=true) und LibVLC bringt ~86 MB native Bibliotheken mit - danach fehlen dem
      # Emulator gut 200 MB. Die vorinstallierten Toolchains des Runners braucht dieser Build nicht.
      - name: Platz auf dem Runner schaffen
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 mit Google-APIs: BaselineProfileRule braucht einen Emulator mit Root-Zugriff auf die Profildatei.
      - name: Profil sammeln
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x gradlew
            ./gradlew :benchmark:connectedReleaseAndroidTest -PbenchmarkEmulator=true -Pandroid.testInstrumentationRunnerArguments.class=com.mg.player.benchmark.BaselineProfileGenerator --stacktrace

      - name: Profil hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Baseline-Profil
          path: |
            benchmark/build/outputs/managed_device_android_test_additional_output/**/*.txt
            benchmark/build/outputs/connected_android_test_additional_output/**/*.txt
          if-no-files-found: warn

      - name: Berichte hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Baseline-Profil-Berichte
          path: benchmark/build/reports/
          if-no-files-found: ignore
