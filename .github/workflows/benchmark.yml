name: Messung (Macrobenchmark, Vorher/Nachher)

# Misst zwei Stände (before/after) nacheinander auf DEMSELBEN Emulator und legt die Zahlen nebeneinander.
# Nur von Hand (workflow_dispatch). Es committet nichts und ändert keinen Branch: Ergebnis sind das Artefakt
# und die Zusammenfassung des Laufs. In config/perf-budget.md wird erst eingetragen, was ein Mensch gelesen hat.
#
# Grenzen, die jeder Leser der Zahlen kennen muss:
# - Emulator, kein Fire TV: Zeiten sind relativ vergleichbar (gleiche Maschine, abwechselnd), aber keine Fire-TV-Werte.
# - Der Fixture-Aufbau (BenchmarkFixture/BenchmarkSetup) lief nach eigener Angabe nie auf einem Gerät: Scheitert ein
#   Benchmark, steht das im Bericht – es wird keine Zahl erfunden.
# Ein reiner workflow_dispatch wird von GitHub erst erkannt, wenn die Datei auf dem Default-Branch liegt (404). Damit nichts
# vor der Messung dorthin muss, startet die Messung auch bei einem Push auf den Messbranch, der diese Dateien ändert.
# Vorher = fester Stand (Remote-Stand vor 3.58–3.60), nachher = der gepushte Commit.
on:
  push:
    branches: [ ccr-messung-3.60 ]
    paths:
      - '.github/workflows/benchmark.yml'
      - '.github/scripts/run-ab-benchmarks.sh'
      - '.github/scripts/summarize-benchmarks.py'
  workflow_dispatch:
    inputs:
      before:
        description: 'Stand vorher (Commit-SHA)'
        required: false
        default: 'c7b7b2c9b71f298112ea79c2eb02b88982cc28b0'
        type: string
      after:
        description: 'Stand nachher (Commit-SHA)'
        required: false
        type: string
      rounds:
        description: 'Runden je Stand (abwechselnd, ab 2 sieht man Drift des Emulators)'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Code auschecken (volle Historie, beide Stände)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: JDK 17 einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Skripte aus dem aktuellen Checkout sichern: Die Stände unten liegen in eigenen Arbeitsverzeichnissen.
      - name: Skripte sichern
        run: |
          mkdir -p "$RUNNER_TEMP/ab"
          cp .github/scripts/run-ab-benchmarks.sh .github/scripts/summarize-benchmarks.py "$RUNNER_TEMP/ab/"
          chmod +x "$RUNNER_TEMP/ab/run-ab-benchmarks.sh"

      - name: Messen (API 34, google_apis, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/ab/run-ab-benchmarks.sh" "${{ inputs.before || 'c7b7b2c9b71f298112ea79c2eb02b88982cc28b0' }}" "${{ inputs.after || github.sha }}" "${{ inputs.rounds || '2' }}"

      - name: Zusammenfassung
        if: always()
        run: python3 "$RUNNER_TEMP/ab/summarize-benchmarks.py" ab-results | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rohdaten hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Messung-Vorher-Nachher
          path: ab-results/
          if-no-files-found: warn
